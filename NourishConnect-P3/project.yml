name: NourishConnect
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  NourishConnect:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - Models
      - Resources
      - Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nourishconnect
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 健康伴你行
        INFOPLIST_KEY_NSCameraUsageDescription: 用相機掃描條碼、營養標籤同埋影你食嘅嘢
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用咪高風同你傾偈
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 將你講嘅廣東話變成文字，同你傾偈
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  NourishConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: NourishConnect
schemes:
  NourishConnect:
    build:
      targets:
        NourishConnect: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NourishConnectTests
